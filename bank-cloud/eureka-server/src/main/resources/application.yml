# ---------------------------------------------------------------------------
# Eureka Server - registro de servicios
# ---------------------------------------------------------------------------
# No pide su configuracion al config server a proposito: si lo hiciera, el
# orden de arranque quedaria encadenado en los dos sentidos y una caida del
# config server se llevaria tambien el descubrimiento.
server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # Ver el javadoc de EurekaServerApplication.
    register-with-eureka: false
    fetch-registry: false
  server:
    # El modo de autoproteccion evita dar de baja instancias cuando sospecha que
    # el problema es de red y no de los servicios. En un solo equipo eso solo
    # logra que un servicio detenido siga apareciendo como vivo durante minutos,
    # y la evidencia de esta entrega necesita justamente mostrar la baja.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    cl.duoc.bank: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
