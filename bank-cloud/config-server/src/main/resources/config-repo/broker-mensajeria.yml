# ===========================================================================
# broker-mensajeria - ActiveMQ Artemis embebido
# ===========================================================================

server:
  # Consola de administracion por HTTP. El protocolo JMS va por el 61616.
  port: 8161

bank:
  broker:
    # Por defecto solo en localhost: fuera de Docker los tres servicios que lo
    # usan corren en la misma maquina. En Docker, compose fija
    # BROKER_ESCUCHA=0.0.0.0 para aceptar conexiones de los otros contenedores,
    # pero el 61616 NO se publica hacia afuera de la red interna de compose.
    # En produccion, ademas, iria con TLS.
    aceptor: "tcp://${BROKER_ESCUCHA:localhost}:61616"
    # Journal en disco. En docker-compose.yaml es un volumen: sobrevive a un
    # reinicio del contenedor, y "docker compose down -v" lo borra.
    datos: ./datos-broker
    # Tres entregas y a la DLQ. Suficiente para superar una falla pasajera -un
    # bloqueo de base, un reinicio- sin demorar indefinidamente un mensaje que
    # nunca se va a poder procesar.
    max-intentos: 3
    espera-reintento-ms: 1000

    # -----------------------------------------------------------------------
    # Un usuario por microservicio, con UN rol cada uno
    # -----------------------------------------------------------------------
    # Los permisos de cada rol estan en BrokerConfig.permisos(), en codigo y
    # no aqui, porque son parte del diseno de la saga -quien es duenio de que
    # hecho- y no un parametro de despliegue. Lo que si es de despliegue son
    # las claves, y por eso estan aqui, con variable de entorno para
    # reemplazarlas.
    #
    # Cada servicio encuentra su clave en su propio archivo (ms-cuentas.yml,
    # etc.). Tiene que ser la misma que aqui; es el precio de que el broker no
    # consulte un directorio externo.
    usuarios:
      - usuario: ms-transferencias
        clave: ${BROKER_CLAVE_TRANSFERENCIAS:transferencias-broker-2026}
        rol: saga-transferencias
      - usuario: ms-cuentas
        clave: ${BROKER_CLAVE_CUENTAS:cuentas-broker-2026}
        rol: participante-cuentas
      - usuario: ms-auditoria
        clave: ${BROKER_CLAVE_AUDITORIA:auditoria-broker-2026}
        rol: auditor
      - usuario: admin-broker
        clave: ${BROKER_CLAVE_ADMIN:admin-broker-2026}
        rol: administrador
