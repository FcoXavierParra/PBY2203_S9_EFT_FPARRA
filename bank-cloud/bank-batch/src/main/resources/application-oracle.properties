# ---------------------------------------------------------------------------
# Perfil 'oracle' - Oracle Autonomous Database (Oracle Cloud)
# ---------------------------------------------------------------------------
# Se activa con --spring.profiles.active=oracle
#
# IMPORTANTE: aqui NO va ninguna credencial. Este archivo se publica en GitHub.
# Los valores se toman de variables de entorno; si falta alguna, la aplicacion
# falla al arrancar con un mensaje claro en vez de conectarse a otra cosa.
#
# En PowerShell, antes de ejecutar:
#
#   $env:ORACLE_JDBC_URL = "jdbc:oracle:thin:@oraclecloudfparradb_low?TNS_ADMIN=C:/oracle/wallet"
#   $env:ORACLE_USER     = "ADMIN"
#   $env:ORACLE_PASSWORD = "la-que-definiste-al-crear-la-base"
#
# El nombre del servicio sale de tnsnames.ora dentro del wallet.
#
# Por que _low y no _high con el Step multihilo
# ---------------------------------------------
# Los sufijos de Autonomous Database no son "mas rapido / mas lento": son grupos
# de consumo con criterios opuestos.
#
#   _high     : pocas sentencias concurrentes, cada una con paralelismo interno.
#   _medium   : intermedio.
#   _low      : sin paralelismo por sentencia, el MAYOR numero de sentencias
#               concurrentes.
#
# Un batch de 3 hilos es exactamente el segundo caso: tres INSERT chicos a la
# vez, ninguno que se beneficie de paralelismo interno. Con _high en una base
# de 1 OCPU las sentencias que exceden el limite de concurrencia quedan en cola,
# y los tres hilos terminan esperando turno: se pierde justamente lo que se
# queria ganar. _low es la opcion correcta aqui, y ademas la mas economica.
# ---------------------------------------------------------------------------

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---------------------------------------------------------------------------
# Pool de conexiones - OPTIMIZACION DE RECURSOS
# ---------------------------------------------------------------------------
# Autonomous Database corta las conexiones ociosas; conviene un pool chico y
# con validacion, porque un batch pasa ratos largos sin tocar la base.
#
# maximum-pool-size = 6 : 3 hilos de chunk + el hilo del Job que actualiza la
# metadata BATCH_* + margen. Debe subir junto con bank.batch.hilos.
spring.datasource.hikari.maximum-pool-size=6

# minimum-idle = 3 importa mucho mas contra la nube que contra una base local.
# Abrir una conexion a Autonomous Database implica handshake TLS mutuo con el
# wallet, y eso cuesta cientos de milisegundos. Si el pool arranca vacio, los
# tres hilos del primer chunk pagan ese costo en serie justo cuando deberian
# estar trabajando en paralelo. Con 3 conexiones ya tibias, el paralelismo
# empieza a rendir desde el primer chunk.
spring.datasource.hikari.minimum-idle=3

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.pool-name=bank-batch-oracle-pool

# Corta una sentencia colgada en vez de dejar el batch esperando para siempre.
# Sin esto, una conexion perdida por la red deja el hilo bloqueado en read()
# hasta que el sistema operativo se rinda, que pueden ser minutos.
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=60000
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=20000

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# El dialecto de Oracle lo detecta Hibernate solo; no hay que declararlo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Spring Batch
# ---------------------------------------------------------------------------
# Crea las 6 tablas de metadata usando el script schema-oracle.sql que trae
# Spring Batch. Si ya existen, Spring Boot detecta y no lo vuelve a correr.
spring.batch.jdbc.initialize-schema=always

# Spring Batch crea la metadata del Job en aislamiento SERIALIZABLE por defecto.
# Oracle implementa ese nivel de forma optimista: ante el menor conflicto aborta
# con ORA-08177 ("no se puede serializar el acceso"). READ_COMMITTED es
# suficiente aqui, porque lo unico que protege es la creacion de la JobInstance.
#
# Con el Step multihilo esto pasa de precaucion a requisito: los tres hilos
# actualizan BATCH_STEP_EXECUTION de la misma StepExecution en cada commit de
# chunk, y bajo SERIALIZABLE ese patron produce ORA-08177 de forma habitual.
spring.batch.jdbc.isolation-level-for-create=READ_COMMITTED
