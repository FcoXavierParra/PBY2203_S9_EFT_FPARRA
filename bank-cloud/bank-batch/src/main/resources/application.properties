spring.application.name=bank-batch

# ---------------------------------------------------------------------------
# Datasource (PostgreSQL via docker-compose)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:bankbatch;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---------------------------------------------------------------------------
# Pool de conexiones - OPTIMIZACION DE RECURSOS
# ---------------------------------------------------------------------------
# Con el Step multihilo hay 3 hilos escribiendo a la vez, cada uno con su
# transaccion abierta, mas el hilo del Job que actualiza la metadata BATCH_*.
# Son 4 conexiones simultaneas como piso.
#
# 6 y no las 10 por defecto de HikariCP: cada conexion ocupa memoria en el
# cliente y un proceso servidor en PostgreSQL. Dimensionar el pool al
# paralelismo real (3 hilos + metadata + margen) es justamente la optimizacion
# que se pide, y ademas hace que un error de configuracion aparezca como
# timeout de pool en vez de esconderse.
#
# Si se sube bank.batch.hilos hay que subir esto en la misma proporcion.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=bank-batch-pool

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# 'update' crea las tablas de negocio (transaccion, cuenta, ...) al arrancar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# El dialecto NO se declara a proposito: Hibernate lo detecta desde la conexion.
# Fijarlo aqui lo heredarian los otros perfiles y romperia la deteccion; con el
# dialecto de PostgreSQL contra Oracle, Hibernate consulta catalogos que no
# existen y falla con ORA-00942.

# Agrupa los INSERT/UPDATE de un chunk en un solo viaje al servidor. Se deja
# igual al tamano del chunk (5): mas grande no serviria, porque el chunk hace
# flush al cerrar su transaccion.
#
# Advertencia honesta: esto solo surte efecto en Transaccion y Cuenta, que
# tienen id asignado desde el CSV. MovimientoAnual usa @GeneratedValue(IDENTITY)
# y Hibernate no puede agrupar inserts cuando necesita el id que devuelve cada
# uno. Migrar esa entidad a SEQUENCE permitiria batchear tambien ahi; se deja
# como mejora pendiente para no cambiar el esquema ya entregado en la semana 1.
spring.jpa.properties.hibernate.jdbc.batch_size=5
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Spring Batch
# ---------------------------------------------------------------------------
# Crea las 6 tablas de metadata (BATCH_JOB_INSTANCE, BATCH_JOB_EXECUTION,
# BATCH_JOB_EXECUTION_PARAMS, BATCH_JOB_EXECUTION_CONTEXT, BATCH_STEP_EXECUTION,
# BATCH_STEP_EXECUTION_CONTEXT) mas las secuencias, si no existen.
spring.batch.jdbc.initialize-schema=always

# Job que se ejecuta al arrancar. Con varios Jobs registrados hay que
# nombrar uno explicitamente, si no Spring Boot falla por ambiguedad.
# Se sobreescribe por linea de comandos para correr cada Job:
#   --spring.batch.job.name=transaccionesJob

# EFT: el Job NO lo lanza el runner de Spring Boot sino ReejecucionAutomatica,
# que lo relanza si termina FAILED por una falla tecnica. Ver esa clase.
spring.batch.job.enabled=false
bank.reejecucion.max-relanzamientos=3
bank.reejecucion.espera-inicial-ms=5000
bank.reejecucion.multiplicador=2.0
# Primeras N verificaciones de conexion que fallan a proposito, para demostrar
# la reejecucion sin apagar la base. 0 = corrida normal.
bank.simulacion.fallas-conexion=0
spring.batch.job.name=transaccionesJob

# ---------------------------------------------------------------------------
# Escalamiento y procesamiento paralelo
# ---------------------------------------------------------------------------
# El proyecto implementa las DOS tecnicas de escalado y deja elegir cual corre.
# Las instrucciones piden decidir entre una y otra; se implementan ambas porque
# el criterio 4 de la pauta pide comparar configuraciones para encontrar la
# optima, y sin las dos no hay comparacion posible.
#
#   multihilo   : un Step, un lector sincronizado, N hilos sobre la misma cola
#                 de chunks. Se dimensiona con bank.batch.hilos.
#   particiones : N StepExecution independientes, cada una con su lector sobre
#                 un rango distinto del archivo. Se dimensiona con
#                 bank.escalado.grid-size y bank.escalado.hilos-particion.
#
# El tamano de chunk esta como constante TAMANO_CHUNK en cada JobConfig.
bank.escalado.modo=multihilo

# Cantidad de particiones en que se divide el archivo. NO es la cantidad de
# hilos: las particiones se reparten sobre el pool de hilos-particion, asi que
# grid-size 8 con 4 hilos procesa 8 rangos de a 4 en paralelo.
bank.escalado.grid-size=3

# Tamano del pool que ejecuta las particiones. Separado de bank.batch.hilos para
# poder barrer las dos variables por separado en el benchmark.
bank.escalado.hilos-particion=3

# Hilos y cola del modo multihilo.
bank.batch.hilos=3
bank.batch.cola=25

# ---------------------------------------------------------------------------
# Dataset de entrada
# ---------------------------------------------------------------------------
# Carpeta bajo src/main/resources/data. Los tres datasets vienen del repositorio
# https://github.com/KariVillagran/bank_legacy_data
#
#   semana_1 : 8-10 filas, datos limpios.
#   semana_2 : 8-10 filas con errores inyectados (montos vacios, fechas
#              2024/01/04, tipo 'invalid', edad -1 y 100). Es el dataset por
#              defecto: es el que ejercita el SkipPolicy y los listeners.
#   semana_3 : ~700 filas por archivo. Es el que hay que usar para la evidencia
#              de paralelismo: con solo 10 filas y chunk 5 hay 2 chunks y nunca
#              se llenan los 3 hilos.
#
#   --bank.dataset=semana_3
bank.dataset=fin_legacy_data/semana_3

# ---------------------------------------------------------------------------
# Politicas de finalizacion y re-ejecucion (semana 2)
# ---------------------------------------------------------------------------
# Reintentos del Step COMPLETO que autoriza CalidadDatosDecider, ademas del
# retry por chunk. Acota el ciclo decider -> step -> decider.
bank.politicas.max-reintentos-step=2

# Proporcion maxima de filas descartadas que se tolera antes de dar el Job por
# FAILED. 0.75 = 75 %. Sobre ese umbral se asume que el archivo de origen viene
# mal y que seguir produciria un informe incorrecto con apariencia de valido.
#
# EFT: valor elegido a partir de la corrida real con el dataset oficial
# fin_legacy_data/semana_3 (1000 filas por archivo, sucias A PROPOSITO segun su
# README): transacciones descarta 52 %, intereses 68 % y anuales 15 %. Con el
# 0.40 de la semana 3 dos de los tres Jobs terminaban FAILED con los datos que
# el propio enunciado entrega. 0.75 deja pasar esos tres archivos y sigue
# rechazando uno que venga peor que el peor de ellos.
#
# Para demostrar el camino FALLIDO sin tocar los datos:
#   --bank.politicas.tolerancia-descartes=0.10
bank.politicas.tolerancia-descartes=0.75

# Interruptor de seguridad DURANTE el Step (BankSkipPolicy): corta en un numero
# absoluto de filas saltadas. Va sobre las 681 que descarta intereses, para que
# la decision la tome el control proporcional de arriba y no este corte.
bank.politicas.limite-skip=900

# Espera entre reintentos de un chunk (politica de reintento con backoff).
# La semana 2 reintentaba 3 veces sin pausa, o sea las tres en el mismo
# instante: se consumian los intentos antes de que la condicion que causo el
# fallo pudiera cambiar. Con crecimiento exponencial las esperas son 200 ms,
# 400 ms y 800 ms, y ademas separa a los hilos que chocaron para que no vuelvan
# a colisionar todos a la vez. Ver PoliticasReintentoConfig.
bank.politicas.backoff-inicial-ms=200
bank.politicas.backoff-multiplicador=2.0
bank.politicas.backoff-maximo-ms=5000

# ---------------------------------------------------------------------------
# Reglas de negocio (Jobs 1, 2 y 3)
# ---------------------------------------------------------------------------
# Job 1: monto sobre el cual una transaccion se marca como anomalia.
bank.transacciones.umbral-anomalia=2500

# Job 2: tasas mensuales. PLACEHOLDERS - confirmar con el facilitador.
#   0.005 = 0,5 % mensual   |   0.015 = 1,5 % mensual
bank.intereses.tasa-ahorro=0.005
bank.intereses.tasa-prestamo=0.015

# Job 3: ruta del informe de auditoria (relativa al directorio de ejecucion).
bank.anuales.archivo-informe=reportes/estados_cuenta_anuales.txt

# Archivo donde el SkipListener deja cada fila descartada, con hilo y motivo.
bank.errores.archivo=reportes/errores.csv

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# El patron declara [%thread] sin truncar: es lo que hace visible el
# paralelismo. En la evidencia se tienen que leer Batch-Thread-1, -2 y -3
# intercalados. El patron por defecto de Spring Boot recorta el nombre del hilo
# a 15 caracteres, lo que basta para "Batch-Thread-1" pero no para el hilo 10 si
# alguna vez se sube el pool.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n

logging.level.cl.duoc.bank=DEBUG
logging.level.org.springframework.batch=INFO
