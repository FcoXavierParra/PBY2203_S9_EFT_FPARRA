# ---------------------------------------------------------------------------
# Perfil 'h2' - base de datos de respaldo
# ---------------------------------------------------------------------------
# El motor oficial del proyecto es PostgreSQL (perfil por defecto). Este perfil
# existe solo para poder compilar, ejecutar los tres Jobs y capturar la
# evidencia en un equipo donde no se pueda instalar o levantar Docker.
#
#   mvn spring-boot:run "-Dspring-boot.run.profiles=h2" ...
#
# La base es en ARCHIVO, no en memoria, para que los datos sigan ahi despues de
# que el proceso termine y se puedan consultar como evidencia.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:file:./target/h2/bankbatch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update

spring.batch.jdbc.initialize-schema=always

# Nota: el proyecto no incluye spring-boot-starter-web, asi que NO hay consola
# web H2. Para inspeccionar las tablas se usa la H2 Shell sobre el archivo
# generado en target/h2/, o directamente los conteos que imprimen los Steps.
